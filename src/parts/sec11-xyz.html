<details data-sec="xyz"><summary>Bathymetry from XYZ file (your own data)</summary><div>
<input type="file" id="xf" accept=".xyz,.txt,.csv,.dat,.pts"><textarea id="snd" rows="3" placeholder="…or paste X Y Z rows here" style="margin-top:4px"></textarea>
<div class="r2"><div><label>Header lines to skip</label><input type="number" id="hdr" value="0" min="0"></div><div><label>Z convention</label><select id="zsg"><option value="down">Positive down (depth)</option><option value="up">Negative down (elevation)</option></select></div>
<div><label>Z unit</label><select id="zun"><option value="1">metres</option><option value="0.3048">feet</option><option value="1.8288">fathoms</option></select></div><div><label>Vertical offset (m)</label><input type="number" id="zoff" value="0" step="0.01"></div></div>
<p class="note">Horizontal coordinates use the system chosen in section {§crs}. Soundings loaded here replace any global data.</p>
<button class="p" id="xl">Load XYZ</button><label><input type="checkbox" id="sb" checked> Show soundings on map</label><label><input type="checkbox" id="sbS" checked> Shaded depth background</label>
<div id="sndR" class="note"></div><button id="sMin">Apply shallowest</button><button id="sP5">Apply 5th percentile</button><button id="sMean">Apply mean</button>
</div></details>
