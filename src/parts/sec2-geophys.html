<details data-sec="geo" open><summary>Geophysical sensors &amp; line spacing</summary><div>
<p class="note">Tick the sensors in the survey spread. The line spacing is set by the sensor that needs the closest lines.</p>
<label><input type="checkbox" id="gSS" checked> Side-scan sonar</label>
<div id="gSSb"><label>Side-scan model and frequency</label><!-- side-scan models: the longest range per side at each frequency (approximate, from makers' published figures) -->
<select id="gSM"><option value="custom">Custom</option><optgroup label="EdgeTech 4125" data-i18n="off"><option value="EdgeTech 4125|400" data-f="400" data-r="150">400 kHz, up to 150 m per side</option><option value="EdgeTech 4125|900" data-f="900" data-r="75">900 kHz, up to 75 m per side</option></optgroup><optgroup label="EdgeTech 4200" data-i18n="off"><option value="EdgeTech 4200|300" data-f="300" data-r="230">300 kHz, up to 230 m per side</option><option value="EdgeTech 4200|600" data-f="600" data-r="120">600 kHz, up to 120 m per side</option></optgroup><optgroup label="Klein 3900" data-i18n="off"><option value="Klein 3900|445" data-f="445" data-r="150">445 kHz, up to 150 m per side</option><option value="Klein 3900|900" data-f="900" data-r="50">900 kHz, up to 50 m per side</option></optgroup><optgroup label="Klein 4900" data-i18n="off"><option value="Klein 4900|455" data-f="455" data-r="200">455 kHz, up to 200 m per side</option><option value="Klein 4900|900" data-f="900" data-r="75">900 kHz, up to 75 m per side</option></optgroup></select>
<p class="note" id="gSMn" hidden></p>
<div class="r2"><div><label>Range per side (m)</label><input type="number" id="gSR" value="75" min="5" step="5"></div><div><label>Seabed coverage</label><select id="gSC"><option value="100">100 %</option><option value="150">150 %</option><option value="200" selected>200 %</option></select></div></div>
<div class="r2"><div><label>Overlap margin (%)</label><input type="number" id="gSO" value="10" min="0" max="50"></div><div><label>Towfish height above seabed (m)</label><input type="number" id="gSA" value="7.5" min="0" step="0.5"></div></div>
<div class="r2"><div><label>Smallest target to detect (m)</label><input type="number" id="gSL" value="1" min="0.1" step="0.1"></div><div><label>Pings needed on the target</label><input type="number" id="gSP" value="3" min="1" step="1"></div></div></div>
<label><input type="checkbox" id="gMG"> Magnetometer</label>
<div id="gMGb"><div class="r2"><div><label>Sensor height above seabed (m)</label><input type="number" id="gMA" value="3" min="0" step="0.5"></div><div><label>Detection distance for the target (m)</label><input type="number" id="gMD" value="8" min="0.5" step="0.5"></div></div>
<label>Sample rate (Hz)</label><input type="number" id="gMF" value="10" min="1" step="1"></div>
<label><input type="checkbox" id="gSB"> Sub-bottom profiler</label>
<div id="gSBb"><label>Line spacing (m)</label><input type="number" id="gBS" value="50" min="1" step="5"></div>
<label><input type="checkbox" id="gSE"> UHR seismic (2D)</label>
<div id="gSEb"><div class="r2"><div><label>Line spacing (m)</label><input type="number" id="gES" value="25" min="1" step="5"></div><div><label>Active streamer length (m)</label><input type="number" id="gEL" value="300" min="0" step="10"></div></div></div>
<label><input type="checkbox" id="gMB"> Multibeam (swath settings below)</label>
<div class="r2"><div><label>Towed sensor layback behind the antenna (m)</label><input type="number" id="gLB" value="50" min="0" step="5"></div><div><label>Extra line extension at each end (m)</label><input type="number" id="gEX" value="0" min="0" step="5"></div></div>
<label>Tie line spacing (m, 0 = use the number of cross lines in section {§dir})</label><input type="number" id="gTI" value="0" min="0" step="50">
<div id="gRes"></div>
</div></details>
